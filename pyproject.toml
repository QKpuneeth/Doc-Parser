[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "output_docling",
    "output_docx",
    "output_pptx",
    "enhanced_output",
    "enhanced_output_vision",
    "test_docx",
    "results",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "PERF",
    "C4",
    "RUF",
]
ignore = [
    "BLE001",
    "RUF001",
]

[tool.ruff.format]
quote-style = "double"
